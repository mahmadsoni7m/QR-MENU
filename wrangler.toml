# wrangler.toml
# ---------------------------------------------------------
# Танзимоти Cloudflare Worker барои QR MENU.
# Дастур: нигаред ба README.md, бахши "Cloudflare Worker".
# ---------------------------------------------------------

name = "qr-menu-worker"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID ва TELEGRAM_WEBHOOK_SECRET
# ҲАРГИЗ дар ин файл нависед — онҳо бо фармони зерин илова мешаванд:
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET   (ихтиёрӣ, вале тавсия мешавад)
